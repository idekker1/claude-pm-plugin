name: tests

# The mechanical merge gate. A job may only auto-merge when this is green.
# Jobs whose `touches` hit a `critical_paths` entry in CLAUDE.md still require human review.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If the project pins an interpreter it must actually run on (a system python,
      # a specific minor version), replace this with that interpreter and say why in
      # a decision record. Testing a configuration that never exists in production is
      # worse than not testing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi

      - name: Lint
        run: {{LINT_COMMAND}}

      - name: Tests
        run: {{TEST_COMMAND}}
